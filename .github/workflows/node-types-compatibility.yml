name: Node types compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumers:
    name: TS 5.8 / Node ${{ matrix.node }} / types ${{ matrix.types }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            types: 20.19.0
          - node: 22.x
            types: 22.13.7
    steps:
      - name: Checkout proposed head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false

      - name: Checkout exact base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            head/package-lock.json

      - name: Build base packages with their locked development dependencies
        working-directory: base
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Build head packages with their locked development dependencies
        working-directory: head
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Compare strict consumer diagnostics and exercise both packed runtimes
        env:
          NODE_TYPES_VERSION: ${{ matrix.types }}
          COMPAT_OUTPUT: ${{ runner.temp }}/node-types-compatibility
        run: node head/.github/scripts/node-types-compatibility.mjs base head "$COMPAT_OUTPUT"

      - name: Retain packed packages, dependency lock, and raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-types-compatibility-${{ matrix.types }}
          path: |
            ${{ runner.temp }}/node-types-compatibility/**/*.tgz
            ${{ runner.temp }}/node-types-compatibility/*.log
            ${{ runner.temp }}/node-types-compatibility/*.json
            ${{ runner.temp }}/node-types-compatibility/consumer/package*.json
            ${{ runner.temp }}/node-types-compatibility/consumer/tsconfig.json
            ${{ runner.temp }}/node-types-compatibility/consumer/consumer.ts
            ${{ runner.temp }}/node-types-compatibility/consumer/runtime.mjs
